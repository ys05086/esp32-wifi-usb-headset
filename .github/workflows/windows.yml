name: ESP32 Audio Bridge Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    # The ESP32-S3 firmware the setup program installs, built in the ESP-IDF container.
    uses: ./.github/workflows/firmware.yml
  ffmpeg:
    # The minimal LGPL FFmpeg the AAC comparison runs, cross-compiled from the pinned source with mingw-w64.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg
          key: ffmpeg-lgpl-${{ hashFiles('tools/build_ffmpeg.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64 make
          sh tools/build_ffmpeg.sh ffmpeg --cross
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-lgpl
          path: ffmpeg/
  build:
    needs: [ffmpeg, firmware]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-lgpl
          path: ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: esp32-wifi-usb-headset-firmware
          path: firmware-dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python -m unittest discover
      - run: python -m PyInstaller --noconfirm --windowed --onedir --name ESP32AudioBridge app.py
      # The setup program shares the folder; its own runtime goes in setup_files next to _internal.
      - run: python -m PyInstaller --noconfirm --windowed --onedir --name ESP32BoardSetup --contents-directory setup_files board_setup.py
      - name: Bundle FFmpeg, the setup program and the firmware
        shell: pwsh
        run: |
          Copy-Item -Recurse ffmpeg dist/ESP32AudioBridge/ffmpeg
          Copy-Item dist/ESP32BoardSetup/ESP32BoardSetup.exe dist/ESP32AudioBridge/
          Copy-Item -Recurse dist/ESP32BoardSetup/setup_files dist/ESP32AudioBridge/setup_files
          Copy-Item -Recurse firmware-dist dist/ESP32AudioBridge/firmware
      - name: Verify the setup program loads its firmware
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'setup-self-test.json'
          $app = Start-Process -FilePath dist/ESP32AudioBridge/ESP32BoardSetup.exe -ArgumentList '--self-test', $report -Wait -PassThru -WindowStyle Hidden
          if ($app.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Setup self-test failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (!$result.bundle) { throw "Setup program did not load the firmware: $($result.bundle_error)" }
          Write-Output "Setup program bundles firmware $($result.bundle_version)"
      - name: Verify bundled AAC codec
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'aac-self-test.json'
          $app = Start-Process -FilePath dist/ESP32AudioBridge/ESP32AudioBridge.exe -ArgumentList '--quality-self-test', $report -Wait -PassThru -WindowStyle Hidden
          if ($app.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Bundled AAC self-test failed' }
          if (!(Get-Content $report -Raw | ConvertFrom-Json).ok) { throw 'Bundled AAC output failed' }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist/ESP32AudioBridge/README.md
          Copy-Item README.ko.md dist/ESP32AudioBridge/README.ko.md
          Copy-Item LICENSE dist/ESP32AudioBridge/LICENSE
          Copy-Item FIRMWARE_INSTALL.md dist/ESP32AudioBridge/FIRMWARE_INSTALL.md
          Copy-Item LICENSING.md dist/ESP32AudioBridge/LICENSING.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/ESP32AudioBridge/THIRD_PARTY_NOTICES.md
          python tools/collect_notices.py --bundle dist/ESP32AudioBridge --output dist/ESP32AudioBridge/licenses
          if ($LASTEXITCODE -ne 0) { throw 'License collection failed' }
          Copy-Item -Recurse licenses/native-reference,licenses/firmware-reference -Destination dist/ESP32AudioBridge/licenses
          Copy-Item licenses/reference-sources.json dist/ESP32AudioBridge/licenses/reference-sources.json
          git rev-parse HEAD | Set-Content dist/ESP32AudioBridge/source-commit.txt
          Compress-Archive -Path dist/ESP32AudioBridge -DestinationPath ESP32-Audio-Bridge-Windows.zip
          (Get-FileHash ESP32-Audio-Bridge-Windows.zip -Algorithm SHA256).Hash | Set-Content SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32-Audio-Bridge-Windows
          path: |
            ESP32-Audio-Bridge-Windows.zip
            SHA256.txt
